plugins {
    id 'com.android.application'
}

// Release signing comes from environment variables (set by the GitHub workflow from repo secrets).
def keystorePath = System.getenv('KEYSTORE_PATH')

android {
    namespace 'io.github.stravix86.subscriptiontracker'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.stravix86.subscriptiontracker'
        minSdk 24
        targetSdk 34
        versionCode((System.getenv('VERSION_CODE') ?: '1') as int)
        versionName System.getenv('VERSION_NAME') ?: '1.0.0'
    }

    signingConfigs {
        release {
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig keystorePath ? signingConfigs.release : signingConfigs.debug
        }
    }

    // The web app itself, copied in by native/stage-web.mjs.
    sourceSets {
        main { assets.srcDirs = ['../../www'] }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core:1.13.1'
}
